# CMSIS-DAP for STM32F407ZET6 SWD
adapter driver cmsis-dap
adapter speed 4000

transport select swd

# target 芯片配置
set CHIPNAME stm32f407zet6
source [find target/stm32f4x.cfg]

# ---------------------------------------------------------------- 复位配置
# 【已修改】原来的最后一行是：
#     reset_config srst_only
#
# 为什么去掉：
#   srst_only 会强制 OpenOCD 只用硬件 SRST（板子上的 NRST 引脚）。
#   如果调试器只接了 4 根线（3V3 / GND / SWDIO / SWCLK）、没有接 NRST，
#   复位动作就没有落点，表现为：
#       Warn : GDB connection 1 ... not halted
#       undefined debug reason 8 (UNDEFINED) - target needs reset
#
#   删掉该行后，会回落到 stm32f4x.cfg 里的：
#       cortex_m reset_config sysresetreq
#   即通过内核 AIRCR.SYSRESETREQ 做软件复位，只靠 SWD 两根线就能复位，
#   完全不依赖 NRST 是否接线。
#
# 如果将来确认板子的 NRST 确实接到了调试器，并且需要"复位期间保持调试连接"
# （connect under reset），再把下面这行取消注释：
#
# reset_config srst_only srst_nogate connect_assert_srst
